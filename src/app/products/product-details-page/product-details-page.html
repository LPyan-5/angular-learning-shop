<a routerLink="/">← Back to products</a>

@if (product.hasValue()) {
  @let p = product.value();
  <div class="panel">
    <img [src]="p.thumbnail" [alt]="p.title" width="160" />
    <h2>{{ p.title }}</h2>
    <p>{{ p.description }}</p>
    <p>{{ p.price | currency }}</p>
    <button (click)="cart.add({ id: p.id, name: p.title, quantity: 1, price: p.price })">Add to cart</button>
  </div>
} @else if (product.error()) {
  <p>Product not found.</p>
} @else if (product.isLoading()) {
  <p>Loading...</p>
}

<div class="card">
  <h3>{{ name() }}</h3>
  <p class="price">{{ price() | currency }}</p>

  <div class="quantity">
    <button class="secondary" (click)="decrease()">-</button>
    <span>{{ quantity() }}</span>
    <button class="secondary" (click)="increase()">+</button>
  </div>

  <p class="total">Total: {{ total() | currency }}</p>

  @if (quantity() > 0) {
    <div class="actions">
      <button (click)="addToCart.emit({id: productId(), name: name(), quantity: quantity(), price: price()})">Add to cart</button>
      <button class="secondary" (click)="clear()">Clear</button>
    </div>
  }
</div>
